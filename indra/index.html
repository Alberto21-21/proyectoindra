<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal</title>
    <link rel="stylesheet" href=../indra/css/styles.css>
    <script>
        function showImage(imageId, displayId) {
            var image = document.getElementById(imageId);
            var displayImage = document.getElementById(displayId);
            displayImage.src = image.src;
            displayImage.style.display = "block";
        }
    </script>
</head>
<body>
    <header>
        <h1>Portal de Eventos</h1>
    </header>

    <main>
        <section>
            <h2>Eventos Destacados</h2>
            <div class="carousel">
                <div class="carousel-item">
                    <img id="event1" src="../indra/img/semillas.jpeg" alt="Semillas" style="width: 250px; height: 200px;">
                    <button onclick="showImage('event1', 'displayImage1')">Ver Evento 1</button>
                    <img id="displayImage1"  alt="Imagen del Evento 1" style="display: none; width: 250px; height: 200px; margin-top: 20px;">
                </div>
                <div class="carousel-item">
                    <img id="event2" src="../indra/img/reciclaje.jpeg" alt="Reciclaje" style="width: 250px; height: 200px;">
                    <button onclick="showImage('event2', 'displayImage2')">Ver Evento 2</button>
                    <img id="displayImage2"  alt="Imagen del Evento 2" style="display: none; width: 250px; height: 200px; margin-top: 20px;">
                </div>
                <div class="carousel-item">
                    <img id="event3" src="../indra/img/energiasolar.jpeg" alt="Energiasolar" style="width: 250px; height: 200px;">
                    <button onclick="showImage('event3', 'displayImage3')">Ver Evento 3</button>
                    <img id="displayImage3"  alt="Imagen del Evento 3" style="display: none; width: 250px; height: 200px; margin-top: 20px;">
                </div>
            </div>
        </section>
    </main>
    <a href="../indra/eventos.html">SIGUIENTE PAGINA</a>
</body>
</html>
